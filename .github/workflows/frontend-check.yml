name: Frontend Check (tsc, lint, build)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
      - '.github/actions/**'

# A push to a PR branch fires the pull_request event only; superseding pushes
# cancel the run they replaced. Runs on main always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run tsc
        run: yarn tsc --skipLibCheck
        working-directory: ./frontend

      - name: Run lint
        run: yarn lint
        working-directory: ./frontend

      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        working-directory: ./frontend
