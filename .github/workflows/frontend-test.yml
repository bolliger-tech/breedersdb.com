name: Frontend Test

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
      - '.github/actions/**'

# A push to a PR branch fires the pull_request event only; superseding pushes
# cancel the run they replaced. Runs on main always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run frontend tests
        run: yarn --cwd=frontend run test:unit:ci
