table:
  name: attributes
  schema: public
object_relationships:
  - name: attribute_cardinalities
    using:
      foreign_key_constraint_on: cardinality
  - name: attribute_data_types
    using:
      foreign_key_constraint_on: data_type
  - name: attribute_types
    using:
      foreign_key_constraint_on: attribute_type
array_relationships:
  - name: attribution_form_fields
    using:
      foreign_key_constraint_on:
        column: attribute_id
        table:
          name: attribution_form_fields
          schema: public
  - name: enum_options
    using:
      foreign_key_constraint_on:
        column: attribute_id
        table:
          name: attribute_enum_options
          schema: public
  - name: attribution_values
    using:
      foreign_key_constraint_on:
        column: attribute_id
        table:
          name: attribution_values
          schema: public
  - name: cached_attributions
    using:
      foreign_key_constraint_on:
        column: attribute_id
        table:
          name: cached_attributions
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - attribute_type
        - cardinality
        - data_type
        - default_value
        - description
        - disabled
        - legend
        - name
        - validation_rule
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - attribute_type
        - cardinality
        - created
        - data_type
        - default_value
        - description
        - disabled
        - id
        - legend
        - modified
        - name
        - validation_rule
      filter: {}
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - attribute_type
        - cardinality
        - data_type
        - default_value
        - description
        - disabled
        - legend
        - name
        - validation_rule
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
configuration:
  column_config:
    cardinality:
      comment: 'How many attribution_values of this attribute an attributed entity (the exact plant, plant_group, cultivar or lot of the attribution) may have. REPEATABLE: any number. UNIQUE_BLOCK: at most one, a further value is rejected. UNIQUE_REPLACE: at most one, a further value deletes the existing one (incl. its notes), regardless of date_attributed. Can only be changed from REPEATABLE to unique if no entity has more than one value.'
  comment: '""- validation_rule"":\n""    JSONB: {min: int, max: int, step: int}"" for ""INTEGER"",\n""           {min: int >= 0, max: int <= 9, step: 1}"" for ""RATING""\n""           {min: float|int, max: float|int, step: float|int}"" for ""FLOAT""\n""    NULL"" for other data types.\n""- data_type"": Can''t be changed once ""attribution_values"" for this ""attribute"" exist.\n""- legend"": Only supported for data_type RATING\n""- default_value"": Not supported for data_type PHOTO\n'
