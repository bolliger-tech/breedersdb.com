table:
  name: crossings
  schema: public
object_relationships:
  - name: father_cultivar
    using:
      foreign_key_constraint_on: father_cultivar_id
  - name: mother_cultivar
    using:
      foreign_key_constraint_on: mother_cultivar_id
array_relationships:
  - name: lots
    using:
      foreign_key_constraint_on:
        column: crossing_id
        table:
          name: lots
          schema: public
  - name: mother_plants
    using:
      foreign_key_constraint_on:
        column: crossing_id
        table:
          name: mother_plants
          schema: public
computed_fields:
  - name: has_descendant_cultivar
    definition:
      function:
        name: crossings_has_descendant_cultivar
        schema: public
      table_argument: crossings_row
    comment: Whether the given cultivar descends from this crossing. If so, it can't become its mother or father cultivar (ancestry cycle).
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - father_cultivar_id
        - is_variety
        - mother_cultivar_id
        - name
        - note
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - created
        - father_cultivar_id
        - id
        - is_variety
        - modified
        - mother_cultivar_id
        - name
        - note
      computed_fields:
        - has_descendant_cultivar
      filter: {}
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - father_cultivar_id
        - is_variety
        - mother_cultivar_id
        - name
        - note
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
