table:
  name: lots
  schema: public
object_relationships:
  - name: crossing
    using:
      foreign_key_constraint_on: crossing_id
  - name: orchard
    using:
      foreign_key_constraint_on: orchard_id
array_relationships:
  - name: attributions
    using:
      foreign_key_constraint_on:
        column: lot_id
        table:
          name: attributions
          schema: public
  - name: cached_attributions
    using:
      foreign_key_constraint_on:
        column: lot_id
        table:
          name: cached_attributions
          schema: public
  - name: cultivars
    using:
      foreign_key_constraint_on:
        column: lot_id
        table:
          name: cultivars
          schema: public
computed_fields:
  - name: has_descendant_crossing
    definition:
      function:
        name: lots_has_descendant_crossing
        schema: public
      table_argument: lots_row
    comment: Whether the given crossing descends from this lot. If so, the lot can't be moved to this crossing (ancestry cycle).
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - crossing_id
        - date_planted
        - date_sowed
        - name_segment
        - name_override
        - note
        - numb_seedlings_grown
        - numb_seedlings_planted
        - numb_seeds_sowed
        - orchard_id
        - plot
        - seed_tray
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - created
        - crossing_id
        - date_planted
        - date_sowed
        - display_name
        - full_name
        - id
        - is_variety
        - modified
        - name_override
        - name_segment
        - note
        - numb_seedlings_grown
        - numb_seedlings_planted
        - numb_seeds_sowed
        - orchard_id
        - plot
        - seed_tray
      computed_fields:
        - has_descendant_crossing
      filter: {}
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - crossing_id
        - date_planted
        - date_sowed
        - name_segment
        - name_override
        - note
        - numb_seedlings_grown
        - numb_seedlings_planted
        - numb_seeds_sowed
        - orchard_id
        - plot
        - seed_tray
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
configuration:
  column_config:
    display_name:
      comment: Generated.
    full_name:
      comment: Set by triggers.
    is_variety:
      comment: Set by triggers.
