table:
  name: users
  schema: public
array_relationships:
  - name: user_tokens
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_tokens
          schema: public
select_permissions:
  - role: public
    permission:
      columns:
        - created
        - email
        - id
        - last_signin
        - last_seen
        - locale
        - modified
        - failed_signin_attempts
        - first_failed_signin_attempt
      filter:
        id:
          _eq: -1
    comment: Dummy to ensure User type is available if not signed in
  - role: user
    permission:
      columns:
        - email
        - locale
        - id
        - failed_signin_attempts
        - first_failed_signin_attempt
        - created
        - last_signin
        - last_seen
        - modified
      filter: {}
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - email
        - locale
      filter: {}
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        id:
          _neq: X-Hasura-User-Id
    comment: ""
configuration:
  column_config:
    failed_signin_attempts:
      comment: Failed attempts only. Reset on successful signin.
    last_seen:
      comment: Latest user_tokens.last_verify of any token. Kept when tokens are deleted.
    last_signin:
      comment: Successful signin.
